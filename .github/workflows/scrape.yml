name: Daily Promo Scraper

on:
  schedule:
    - cron: '0 5 * * *'  # Runs daily at 05:00 UTC (08:00 EEST Sofia)
  workflow_dispatch:      # Allows manual trigger button

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scraper Script
        run: python build_promos.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add promos_v1.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update promo data" && git push)
